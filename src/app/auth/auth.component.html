<div class="row">
  <div class="col-xs-12 col-md-6 col-md-offset-3">
    <div style="text-align: center;" *ngIf="isLoading">
        <app-loading-spinner/>
    </div>
    <!-- <div class="alert alert-danger" *ngIf="error && !isLoading">
       <p>{{error}}</p> 
    </div> -->
    <app-alert [message]="error"*ngIf="error && !isLoading" (close)="onHandleError()" ></app-alert>
    <form #authForm="ngForm" (ngSubmit)="onFormSubmit(authForm)">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" class="form-control" required email ngModel name="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" class="form-control" required ngModel name="password" minlength="6" />
      </div>
      <div>
        <button class="btn btn-primary" type="submit" [disabled]="!authForm.valid">{{isLoginMode?"Login":"Sign Up"}}</button> |
        <button class="btn btn-primary" (click)="onSwitchMode()" type="button">Switch to {{isLoginMode?"Sign Up":"Login"}}</button>
      </div>
    </form>
  </div>
</div>
